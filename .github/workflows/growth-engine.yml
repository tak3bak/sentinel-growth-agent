name: "Nomadik Sentinel Growth Agent"

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 8:00 AM MDT (14:00 UTC)
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  execute-growth-engine:
    name: Execute Sentinel Growth Agent Engine
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Application Modules & Execute Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Verify FastAPI import and app initialization
          python -c "import main; print('[*] FastAPI application initialized successfully.')"
          
          # If growth_agent.py or specific engine script exists, execute it
          if [ -f "growth_agent.py" ]; then
            python growth_agent.py
          elif [ -f "src/growth_agent.py" ]; then
            python src/growth_agent.py
          fi
