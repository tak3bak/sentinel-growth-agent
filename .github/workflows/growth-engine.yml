name: "Nomadik Sentinel Growth Agent"

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  execute-growth-engine:
    name: Execute Sentinel Growth Agent Engine
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Configure Git & Install Dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt || pip install -r requirements.txt --no-deps || true
          fi

      - name: Execute Lead Ingestion & Qualification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "main.py" ]; then
            python main.py
          elif [ -f "growth_agent.py" ]; then
            python growth_agent.py
          fi
