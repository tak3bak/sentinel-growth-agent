name: "Nomadik Sentinel Growth Agent"

on:
  schedule:
    - cron: '0 14 * * *' # Daily at 8:00 AM MDT (14:00 UTC)
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  execute-growth-engine:
    name: Execute Sentinel Growth Agent Engine
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Lead Ingestion & Qualification
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f "main.py" ]; then
            python main.py || python -m src.main || echo "[WARN] Main execution fallback."
          elif [ -f "growth_agent.py" ]; then
            python growth_agent.py
          fi
