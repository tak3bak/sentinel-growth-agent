name: Deploy Growth Agent & Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  verify_and_deploy:
    name: Backend Test, Lint & Frontend Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-asyncio

      - name: Run Unit Tests
        run: |
          if [ -d tests ] && [ -n "$(ls -A tests/test_*.py 2>/dev/null)" ]; then
            python -m unittest discover -s tests -v
          else
            echo "No test files present."
          fi

      - name: Verify Bundle
        run: |
          mkdir -p dist
          if [ -f index.html ] && [ ! -f dist/index.html ]; then
            cp index.html dist/index.html
          fi
          test -f dist/index.html
          echo "Frontend bundle verified in dist/index.html"
