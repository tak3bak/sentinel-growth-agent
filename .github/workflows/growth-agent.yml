name: Nomadik Sentinel Growth Agent

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in Dry-Run mode (generates pitches without sending emails)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  run-outbound-engine:
    name: Execute Sentinel Growth Agent Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install dnspython groq resend requests pydantic python-dotenv

      - name: Initialize Local Storage Directory
        run: |
          mkdir -p data logs
          chmod -R 755 data logs

      - name: Run Outbound Growth Engine
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "Starting Sentinel Growth Agent execution..."
          python outbound_engine.py

      - name: Upload Growth Agent Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-agent-logs-${{ github.run_id }}
          path: |
            logs/
            data/*.db
          retention-days: 7
