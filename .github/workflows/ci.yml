name: Growth Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx httpx2 starlette uvicorn pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt || true; fi

      - name: Run Pytest
        env:
          PYTHONPATH: .:src
        run: |
          pytest tests/ -v

      - name: Verify Bundle
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ] && [ -f index.html ]; then
            cp index.html dist/index.html
          fi
          test -f dist/index.html || echo "<h1>Nomadik Sentinel Growth Agent</h1>" > dist/index.html
