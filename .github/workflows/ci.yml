name: Growth Agent CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio anyio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run test suite with coverage enforcement
        run: |
          PYTHONPATH=src pytest tests/ --cov=growth_agent --cov-report=term-missing --cov-fail-under=100 -v
