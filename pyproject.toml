[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "growth-agent"
version = "1.0.0"
description = "Sentinel Growth Agent API"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "stripe",
    "httpx",
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]
